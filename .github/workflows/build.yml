name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions pinned to commit SHAs (tag in the comment) so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test TaskbarGroups.slnx

      - name: Publish (win-x64)
        run: dotnet publish src/TaskbarGroups -c Release -r win-x64 -p:Platform=x64 -o artifacts/publish/win-x64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TaskbarGroups-win-x64
          path: artifacts/publish/win-x64
          retention-days: 14
