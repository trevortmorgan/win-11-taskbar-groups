name: release

# Push a tag like v0.3.0 (or v0.3.0-beta.1 for a pre-release) to publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload the zips
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Actions pinned to commit SHAs (tag in the comment) so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Work out the version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "Tag '$tag' isn't vMAJOR.MINOR.PATCH[-suffix]." }
          "VERSION=$($Matches[1])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Test
        run: dotnet test TaskbarGroups.slnx

      - name: Publish and zip
        shell: pwsh
        run: |
          foreach ($p in @(@{ rid = 'win-x64'; platform = 'x64' }, @{ rid = 'win-arm64'; platform = 'ARM64' })) {
            $out = "artifacts/publish/$($p.rid)"
            dotnet publish src/TaskbarGroups -c Release -r $p.rid "-p:Platform=$($p.platform)" "-p:Version=$env:VERSION" -o $out
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $($p.rid)." }
            Compress-Archive -Path "$out/*" -DestinationPath "artifacts/TaskbarGroups-$env:VERSION-$($p.rid).zip"
          }
          Get-ChildItem artifacts/*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File -Encoding ascii artifacts/SHA256SUMS.txt

      - name: Create the release
        shell: pwsh
        run: |
          $pre = if ($env:VERSION.Contains('-')) { '--prerelease' } else { $null }
          gh release create '${{ github.ref_name }}' artifacts/*.zip artifacts/SHA256SUMS.txt `
            --title "Taskbar Groups $env:VERSION" --generate-notes --verify-tag $pre
