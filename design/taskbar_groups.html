<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Taskbar Custom Grouping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Dark Abstract Desktop Wallpaper Simulation */
        body {
            background: #020617;
            background-image: 
                radial-gradient(ellipse 80% 80% at 20% -20%, rgba(37, 99, 235, 0.35), transparent),
                radial-gradient(ellipse 80% 80% at 80% 120%, rgba(147, 51, 234, 0.25), transparent),
                radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.1), transparent);
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }
        
        /* Windows 11 Style Active App Indicators */
        .active-dot {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 3px;
            background-color: #9ca3af;
            border-radius: 9999px;
            transition: all 0.2s;
        }
        
        .active-dot.focus {
            width: 16px;
            background-color: #60a5fa;
        }

        /* Popup Animations */
        @keyframes fadeInFlyout {
            from { opacity: 0; transform: translate(-50%, 10px) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        @keyframes fadeInPopup {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        #flyout-menu.animate-fade-in {
            animation: fadeInFlyout 0.15s ease-out forwards;
        }
        #edit-popup.animate-fade-in {
            animation: fadeInPopup 0.15s ease-out forwards;
        }
    </style>
</head>
<body class="text-white relative">

    <!-- Desktop Background decorative elements -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-[0.03]">
        <i class="fa-brands fa-windows text-[25rem] text-white filter blur-xl"></i>
    </div>
    
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center text-white/50 pointer-events-none">
        <h1 class="text-4xl font-semibold mb-2 shadow-black drop-shadow-md">Resize window to test responsiveness</h1>
        <p class="text-sm">Under 900px, the Taskbar Groups will collapse into a single menu.</p>
    </div>

    <!-- Taskbar Container (Transparent) -->
    <div class="fixed bottom-0 w-full h-14 flex items-center justify-center px-4 bg-transparent z-10 pb-1 gap-1">
        
        <!-- Standard Icons (Start, Search, Task View) -->
        <button class="w-10 h-10 flex items-center justify-center rounded-md hover:bg-white/10 transition-colors relative text-blue-400 text-xl group">
            <i class="fa-brands fa-windows transition-transform group-active:scale-90"></i>
        </button>
        <button class="w-10 h-10 flex items-center justify-center rounded-md hover:bg-white/10 transition-colors relative text-white text-lg group">
            <i class="fa-solid fa-magnifying-glass transition-transform group-active:scale-90"></i>
        </button>
        <button class="w-10 h-10 flex items-center justify-center rounded-md hover:bg-white/10 transition-colors relative text-gray-200 text-lg group">
            <i class="fa-solid fa-clone transition-transform group-active:scale-90"></i>
        </button>

        <!-- Divider -->
        <div class="w-px h-6 bg-white/20 mx-2"></div>

        <!-- Desktop Groups Container (Hidden on narrow screens) -->
        <div class="max-[900px]:hidden flex items-center gap-2">
            
            <!-- Group 1: Work (Blue) -->
            <div class="flex items-center p-1 rounded-xl bg-blue-500/10 border-t-2 border-t-blue-500 border border-blue-500/20 shadow-[0_-2px_10px_rgba(59,130,246,0.15)] transition-all">
                <button class="text-xs font-semibold text-blue-300 px-2.5 py-1.5 rounded-lg hover:bg-blue-500/20 transition-colors whitespace-nowrap flex items-center gap-2">
                    <div class="w-2.5 h-2.5 rounded-full bg-blue-400"></div> Work
                </button>
                <div class="flex items-center gap-0.5 pl-1">
                    <button class="w-9 h-9 flex items-center justify-center rounded hover:bg-white/10 transition-colors text-yellow-400 text-base"><i class="fa-solid fa-folder"></i></button>
                    <button class="w-9 h-9 flex items-center justify-center rounded hover:bg-white/10 transition-colors text-blue-200 text-base"><i class="fa-solid fa-envelope"></i></button>
                    <button class="w-9 h-9 flex items-center justify-center rounded hover:bg-white/10 transition-colors text-white text-base"><i class="fa-solid fa-file-word"></i></button>
                </div>
            </div>

            <!-- Group 2: Gaming (Purple) -->
            <div class="flex items-center p-1 rounded-xl bg-purple-500/10 border-t-2 border-t-purple-500 border border-purple-500/20 shadow-[0_-2px_10px_rgba(168,85,247,0.15)] transition-all">
                <button class="text-xs font-semibold text-purple-300 px-2.5 py-1.5 rounded-lg hover:bg-purple-500/20 transition-colors whitespace-nowrap flex items-center gap-2">
                    <div class="w-2.5 h-2.5 rounded-full bg-purple-400"></div> Gaming
                </button>
                <div class="flex items-center gap-0.5 pl-1">
                    <button class="w-9 h-9 flex items-center justify-center rounded hover:bg-white/10 transition-colors text-white text-base"><i class="fa-solid fa-gamepad"></i></button>
                    <button class="w-9 h-9 flex items-center justify-center rounded hover:bg-white/10 transition-colors text-gray-300 text-base"><i class="fa-solid fa-headset"></i></button>
                </div>
            </div>

            <!-- Group 3: Browsers (Orange) -->
            <div class="flex items-center p-1 rounded-xl bg-orange-500/10 border-t-2 border-t-orange-500 border border-orange-500/20 shadow-[0_-2px_10px_rgba(249,115,22,0.15)] transition-all">
                <button class="text-xs font-semibold text-orange-300 px-2.5 py-1.5 rounded-lg hover:bg-orange-500/20 transition-colors whitespace-nowrap flex items-center gap-2">
                    <div class="w-2.5 h-2.5 rounded-full bg-orange-400"></div> Browsers
                </button>
                <div class="flex items-center gap-0.5 pl-1">
                    <button class="w-9 h-9 flex items-center justify-center rounded hover:bg-white/10 transition-colors text-orange-500 text-base"><i class="fa-solid fa-globe"></i></button>
                    <button class="w-9 h-9 flex items-center justify-center rounded hover:bg-white/10 transition-colors text-blue-300 text-base"><i class="fa-solid fa-compass"></i></button>
                </div>
            </div>

            <!-- Group 4: Media (Green) -->
            <div class="flex items-center p-1 rounded-xl bg-green-500/10 border-t-2 border-t-green-500 border border-green-500/20 shadow-[0_-2px_10px_rgba(34,197,94,0.15)] transition-all">
                <button class="text-xs font-semibold text-green-300 px-2.5 py-1.5 rounded-lg hover:bg-green-500/20 transition-colors whitespace-nowrap flex items-center gap-2">
                    <div class="w-2.5 h-2.5 rounded-full bg-green-400"></div> Media
                </button>
                <div class="flex items-center gap-0.5 pl-1">
                    <button class="w-9 h-9 flex items-center justify-center rounded hover:bg-white/10 transition-colors text-green-400 text-base"><i class="fa-solid fa-circle-play"></i></button>
                    <button class="w-9 h-9 flex items-center justify-center rounded hover:bg-white/10 transition-colors text-red-400 text-base"><i class="fa-solid fa-music"></i></button>
                </div>
            </div>

        </div>

        <!-- Mobile Groups Trigger (Visible only under 900px) -->
        <div class="min-[901px]:hidden relative">
            <button id="mobile-groups-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-gray-800/60 backdrop-blur-md hover:bg-gray-700/80 border border-gray-500/50 shadow-lg transition-colors text-sm font-medium text-gray-100">
                <i class="fa-solid fa-layer-group text-blue-400"></i>
                Groups
                <i class="fa-solid fa-chevron-up text-xs transition-transform duration-300 ml-1" id="mobile-chevron"></i>
            </button>
            
            <!-- Mobile Flyout Menu (Glassmorphism) -->
            <div id="mobile-flyout" class="hidden absolute bottom-[130%] left-1/2 -translate-x-1/2 w-72 p-4 rounded-2xl bg-gray-900/80 backdrop-blur-2xl border border-gray-600/50 shadow-2xl z-50 origin-bottom animate-fade-in flex flex-col gap-4">
                
                <!-- Work -->
                <div class="flex flex-col gap-1.5">
                    <div class="text-xs font-semibold text-blue-300 flex items-center gap-2 px-1"><div class="w-2 h-2 rounded-full bg-blue-400 shadow-[0_0_5px_rgba(96,165,250,0.8)]"></div> Work</div>
                    <div class="flex items-center gap-1 bg-white/5 border border-white/5 p-1.5 rounded-xl">
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors text-yellow-400 text-lg"><i class="fa-solid fa-folder"></i></button>
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors text-blue-200 text-lg"><i class="fa-solid fa-envelope"></i></button>
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors text-white text-lg"><i class="fa-solid fa-file-word"></i></button>
                    </div>
                </div>

                <!-- Gaming -->
                <div class="flex flex-col gap-1.5">
                    <div class="text-xs font-semibold text-purple-300 flex items-center gap-2 px-1"><div class="w-2 h-2 rounded-full bg-purple-400 shadow-[0_0_5px_rgba(192,132,252,0.8)]"></div> Gaming</div>
                    <div class="flex items-center gap-1 bg-white/5 border border-white/5 p-1.5 rounded-xl">
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors text-white text-lg"><i class="fa-solid fa-gamepad"></i></button>
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors text-gray-300 text-lg"><i class="fa-solid fa-headset"></i></button>
                    </div>
                </div>

                <!-- Browsers -->
                <div class="flex flex-col gap-1.5">
                    <div class="text-xs font-semibold text-orange-300 flex items-center gap-2 px-1"><div class="w-2 h-2 rounded-full bg-orange-400 shadow-[0_0_5px_rgba(251,146,60,0.8)]"></div> Browsers</div>
                    <div class="flex items-center gap-1 bg-white/5 border border-white/5 p-1.5 rounded-xl">
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors text-orange-500 text-lg"><i class="fa-solid fa-globe"></i></button>
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors text-blue-300 text-lg"><i class="fa-solid fa-compass"></i></button>
                    </div>
                </div>
                
                <!-- Media -->
                <div class="flex flex-col gap-1.5">
                    <div class="text-xs font-semibold text-green-300 flex items-center gap-2 px-1"><div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_5px_rgba(74,222,128,0.8)]"></div> Media</div>
                    <div class="flex items-center gap-1 bg-white/5 border border-white/5 p-1.5 rounded-xl">
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors text-green-400 text-lg"><i class="fa-solid fa-circle-play"></i></button>
                        <button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors text-red-400 text-lg"><i class="fa-solid fa-music"></i></button>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        // Toggle Flyout Menu (Mobile)
        const mobileGroupsBtn = document.getElementById('mobile-groups-btn');
        const mobileFlyout = document.getElementById('mobile-flyout');
        const mobileChevron = document.getElementById('mobile-chevron');

        mobileGroupsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isHidden = mobileFlyout.classList.contains('hidden');
            
            if (isHidden) {
                mobileFlyout.classList.remove('hidden');
                mobileChevron.style.transform = 'rotate(180deg)';
            } else {
                mobileFlyout.classList.add('hidden');
                mobileChevron.style.transform = 'rotate(0deg)';
            }
        });

        // Close UI when clicking outside
        document.addEventListener('click', (e) => {
            if (mobileFlyout && !mobileFlyout.contains(e.target) && !mobileGroupsBtn.contains(e.target)) {
                mobileFlyout.classList.add('hidden');
                mobileChevron.style.transform = 'rotate(0deg)';
            }
        });
    </script>
</body>
</html>
